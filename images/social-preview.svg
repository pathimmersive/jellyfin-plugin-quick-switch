        <path d="M34 14 H-34 M -20 0 L-34 14 L-20 28"/>
      </g>
    </g>
  </g>
  <g font-family="'Segoe UI', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="296" font-size="92" font-weight="700" fill="#ffffff">Quick Switch</text>
    <text x="604" y="366" font-size="34" fill="#ffffff" fill-opacity=".72">Switch Jellyfin accounts on a shared TV</text>
    <text x="604" y="412" font-size="34" fill="#ffffff" fill-opacity=".72">without typing a password.</text>
    <text x="604" y="478" font-size="24" font-weight="600" fill="#00a4dc">Unofficial Jellyfin server plugin</text>
  </g>
