# A version tag (v1.2.3 or v1.2.3.4) packages the plugin, creates the GitHub Release
# with the zip and its manifest entry, then rebuilds manifest.json on GitHub Pages.
# A release that already exists is never replaced: a fix ships as a new version.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version's CHANGELOG.md section is the release notes and the manifest's changelog;
          # a version without one is not released.
          mkdir -p release
          bash scripts/changelog.sh "$TAG" > release/notes.md
          bash scripts/package.sh "$TAG" release \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG" "$(cat release/notes.md)"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/quick-switch_*.zip release/quick-switch_*.json \
            --verify-tag --title "Quick Switch $TAG" --notes-file release/notes.md

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
