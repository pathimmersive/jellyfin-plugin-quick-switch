version: 2
updates:
  # The Jellyfin packages are left out: building against a newer Jellyfin
  # raises the oldest server the plugin runs on. The Canary workflow checks
  # the newest Jellyfin each week instead.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "Jellyfin.*"

  # ESLint, the only npm dependency; the switcher itself has no build step.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
